name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    name: Testes Automatizados Postman
    runs-on: ubuntu-latest

    steps:
      - name: Baixando os arquivos do repositório
        uses: actions/checkout@v4

      - name: Instalando o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalando o Newman
        run: npm install -g newman

      - name: Rodando os Testes da Petstore
        run: newman run petstore_collection.json --reporters cli

  web-tests:
    name: Web tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Web tests headless
        env:
          PETSTORE_BASE_URL: https://petstore.swagger.io/v2
          SAUCEDEMO_BASE_URL: https://www.saucedemo.com/
          SAUCEDEMO_STANDARD_USER: standard_user
          SAUCEDEMO_LOCKED_USER: locked_out_user
          SAUCEDEMO_PASSWORD: secret_sauce
          SAUCEDEMO_HEADLESS: "true"
          SCREENSHOT_DIR: screenshots
        run: pytest tests/web -q --html=report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-report
          path: |
            report.html
            screenshots/
          if-no-files-found: ignore
